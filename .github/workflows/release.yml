name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag manual da release (ex: v0.2.0). Vazio = calcular automaticamente"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular próxima versão
        id: version
        env:
          MANUAL_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_TAG:-}" ]; then
            TAG="$MANUAL_TAG"
          else
            LAST="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
            LAST="${LAST:-v0.0.0}"
            IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
            if [ "$LAST" = "v0.0.0" ]; then RANGE="HEAD"; else RANGE="$LAST..HEAD"; fi
            SUBJECTS="$(git log "$RANGE" --format=%s)"
            if echo "$SUBJECTS" | grep -Eq '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE'; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            elif echo "$SUBJECTS" | grep -Eq '^feat(\(|:)'; then
              MINOR=$((MINOR + 1)); PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Release: $TAG"

      - name: Aplicar versão no Info.plist (apenas no runner)
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Resources/Info.plist || true

      - name: Empacotar aplicativo (.app, .dmg, .zip e SHA256SUMS)
        run: ./scripts/package-release.sh

      - name: Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "herd ${TAG#v}" \
              --generate-notes
          fi
